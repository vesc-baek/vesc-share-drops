<script>
(async function () {
  const EXPECT = "5cf8fc3a05b0518c070eda490d2a2c1352cfffc442ea1b005a33c254c820661f";
  const norm = (s) => String(s || '').replace(/\D+/g, '');
  async function sha256hex(text) {
    const data = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function decodePayload() {
    const b64 = (document.getElementById('payload-b64').textContent || '').replace(/\s+/g, '');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  async function tryUnlock(pw) {
    const h = await sha256hex(norm(pw));
    if (h !== EXPECT) return false;
    const page = decodePayload();
    const blob = new Blob([page], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    // location.replace avoids back-button returning to empty gate after write failures
    location.replace(url);
    return true;
  }
  const input = document.getElementById('pw');
  const err = document.getElementById('err');
  const go = document.getElementById('go');
  async function submit() {
    err.textContent = '';
    go.disabled = true;
    try {
      const ok = await tryUnlock(input.value || '');
      if (!ok) {
        err.textContent = '비밀번호가 달라요. 숫자만 입력해 보세요.';
        go.disabled = false;
      }
    } catch (e) {
      err.textContent = '열기에 실패했어요. 다시 시도해 주세요.';
      go.disabled = false;
      console.error(e);
    }
  }
  go.addEventListener('click', submit);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  input.focus();
})();
</script>
